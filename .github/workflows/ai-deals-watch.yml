name: AI Deals Watch

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Tester le workflow sans appeler Gemini"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    # Mardi 03:23 Europe/Paris
    - cron: "23 3 * * 2"
      timezone: "Europe/Paris"
    # Vendredi 03:37 Europe/Paris
    - cron: "37 3 * * 5"
      timezone: "Europe/Paris"

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-deals-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate code without API credits
        run: |
          python -m py_compile scripts/run_watch.py
          python -m unittest discover -s tests

      - name: Run watch
        id: watch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_NOTIFY_NO_CHANGE: "false"
          DISCORD_MAX_MESSAGES: "8"
          DISCORD_ATTACH_FULL_REPORT: "true"
          GEMINI_MODEL: "gemini-2.5-flash-lite"
          AI_DEALS_MAX_OFFERS: "12"
          GEMINI_MAX_OUTPUT_TOKENS: "8192"
          GEMINI_USE_GROUNDING: "true"
          GEMINI_MAX_RETRIES: "1"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' && 'true' || 'false' }}
        run: python scripts/run_watch.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-deals-debug
          path: |
            reports/failed_raw_response.txt
            reports/changes.md
            reports/latest.md
          if-no-files-found: ignore

      - name: Commit report if changed
        if: steps.watch.outputs.changed == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true')
        run: |
          git config user.name "ai-deals-bot"
          git config user.email "actions@github.com"
          git add data reports
          git commit -m "chore: update AI deals watch"
          git push

      - name: Create GitHub issue if changed
        if: steps.watch.outputs.changed == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Veille bons plans IA: ${{ steps.watch.outputs.new_count }} nouveaux, ${{ steps.watch.outputs.modified_count }} modifiés" \
            --body-file reports/changes.md

name: AI Deals Watch

on:
  workflow_dispatch:
  schedule:
    # Mardi 07:17 Europe/Paris
    - cron: "17 7 * * 2"
      timezone: "Europe/Paris"
    # Vendredi 07:37 Europe/Paris
    - cron: "37 7 * * 5"
      timezone: "Europe/Paris"

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-deals-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run watch
        id: watch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # "true" pour envoyer aussi un message Discord quand rien ne change.
          DISCORD_NOTIFY_NO_CHANGE: "false"
          # Limite anti-spam. Le rapport complet reste dans reports/latest.md.
          DISCORD_MAX_MESSAGES: "6"
        run: python scripts/run_watch.py

      - name: Commit report if changed
        if: steps.watch.outputs.changed == 'true'
        run: |
          git config user.name "ai-deals-bot"
          git config user.email "actions@github.com"
          git add data reports
          git commit -m "chore: update AI deals watch"
          git push

      - name: Create GitHub issue if changed
        if: steps.watch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Veille bons plans IA: ${{ steps.watch.outputs.new_count }} nouveaux, ${{ steps.watch.outputs.modified_count }} modifiés" \
            --body-file reports/changes.md
